<section class="ftco-booking">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <form action="{% url 'hotelbooking:rooms' %}" method="post" class="booking-form">
                    {% csrf_token %}
                    <div class="row">
                        <!-- Check-in Date -->
                        <div class="col-md-2 d-flex">
                            <div class="form-group p-4 align-self-stretch d-flex align-items-end">
                                <div class="wrap">
                                    <label for="checkin_date">Check-in</label>
                                    <input type="date"
                                           name="start_date"
                                           id="checkin_date"
                                           class="form-control"
                                           placeholder="Check-in date">
                                </div>
                            </div>
                        </div>
                        <!-- Check-out Date -->
                        <div class="col-md-2 d-flex">
                            <div class="form-group p-4 align-self-stretch d-flex align-items-end">
                                <div class="wrap">
                                    <label for="checkout_date">Check-out</label>
                                    <input type="date"
                                           name="end_date"
                                           id="checkout_date"
                                           class="form-control"
                                           placeholder="Check-out date">
                                </div>
                            </div>
                        </div>
                        <!-- Room Type -->
                        <div class="col-md-3 d-flex">
                            <div class="form-group p-4 align-self-stretch d-flex align-items-end">
                                <div class="wrap">
                                    <label for="room_type">Room</label>
                                    <div class="form-field">
                                        <div class="select-wrap">
                                            <div class="icon">
                                                <span class="ion-ios-arrow-down"></span>
                                            </div>
                                            <select class="form-control" name="room_type" id="room_type">
                                                <option value="">All room types</option>
                                                {% for category in room_categories %}
                                                <option value="{{ category.id }}">{{ category.name }}</option>
                                                {% endfor %}
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- Guests -->
                        <div class="col-md-2 d-flex">
                            <div class="form-group p-4 align-self-stretch d-flex align-items-end">
                                <div class="wrap w-100">
                                    <label>Guests</label>
                                    <div class="row">
                                        <div class="col-6 pr-1">
                                            <label for="adults" class="small mb-1">Adults</label>
                                            <div class="form-field">
                                                <div class="select-wrap">
                                                    <div class="icon">
                                                        <span class="ion-ios-arrow-down"></span>
                                                    </div>
                                                    <select class="form-control" name="adults" id="adults">
                                                        {% for n in "123456" %}
                                                        <option value="{{ n }}" {% if adults|stringformat:"s" == n %}selected{% endif %}>{{ n }}</option>
                                                        {% endfor %}
                                                    </select>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-6 pl-1">
                                            <label for="children" class="small mb-1">Children</label>
                                            <div class="form-field">
                                                <div class="select-wrap">
                                                    <div class="icon">
                                                        <span class="ion-ios-arrow-down"></span>
                                                    </div>
                                                    <select class="form-control" name="children" id="children">
                                                        {% for n in "01234" %}
                                                        <option value="{{ n }}" {% if children|stringformat:"s" == n %}selected{% endif %}>{{ n }}</option>
                                                        {% endfor %}
                                                    </select>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- Submit Button -->
                        <div class="col-md-3 d-flex">
                            <div class="form-group d-flex align-self-stretch">
                                <input type="submit"
                                       value="Check Availability"
                                       class="btn btn-primary py-3 px-4 align-self-stretch">
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
<script>
(function () {
    // Clicking a date field opens the calendar picker, and past dates
    // cannot be picked.
    var today = new Date().toISOString().split('T')[0];
    document.querySelectorAll('.booking-form input[type="date"]').forEach(function (input) {
        input.min = today;
        input.addEventListener('click', function () {
            try { if (input.showPicker) input.showPicker(); } catch (e) {}
        });
    });
})();
</script>
