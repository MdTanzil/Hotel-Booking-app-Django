{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <title>
      {% block title %}
      {% endblock title %}
    </title>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://fonts.googleapis.com/css?family=Poppins:200,300,400,500,600,700"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Playfair+Display:400,400i,700,700i"
          rel="stylesheet">
    <link rel="stylesheet"
          href="{% static 'css/open-iconic-bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/animate.css' %}">
    <link rel="stylesheet" href="{% static 'css/owl.carousel.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/owl.theme.default.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/magnific-popup.css' %}">
    <link rel="stylesheet" href="{% static 'css/aos.css' %}">
    <link rel="stylesheet" href="{% static 'css/ionicons.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap-datepicker.css' %}">
    <link rel="stylesheet" href="{% static 'css/jquery.timepicker.css' %}">
    <link rel="stylesheet" href="{% static 'css/flaticon.css' %}">
    <link rel="stylesheet" href="{% static 'css/icomoon.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
      /* Keep the navbar on one row when signed in (extra links: My Bookings, Admin Panel, Logout). */
      @media (min-width: 992px) {
        .ftco-navbar-light .navbar-nav > .nav-item > .nav-link {
          padding-left: 0.55rem;
          padding-right: 0.55rem;
        }
      }
      /* Flash messages as popups: fixed top-right, floating over the page
         instead of taking up layout space. */
      .messages-toast {
        position: fixed;
        top: 80px;
        right: 20px;
        z-index: 9999;
        width: 360px;
        max-width: calc(100vw - 40px);
      }
      .messages-toast .alert {
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      }
      @media (max-width: 576px) {
        .messages-toast {
          top: 70px;
          right: 10px;
          left: 10px;
          width: auto;
        }
      }
    </style>
  </head>
  <body>
    {% include 'navbar.html' %}
    {% if messages %}
    <div class="messages-toast">
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="close" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">&times;</span></button>
        </div>
      {% endfor %}
    </div>
    {% endif %}
    {% block body %}
    {% endblock body %}

    {% include 'footer.html' %}
    <script src="{% static 'js/jquery.min.js' %}"></script>
    <script src="{% static 'js/jquery-migrate-3.0.1.min.js' %}"></script>
    <script src="{% static 'js/popper.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
    <script src="{% static 'js/jquery.easing.1.3.js' %}"></script>
    <script src="{% static 'js/jquery.waypoints.min.js' %}"></script>
    <script src="{% static 'js/jquery.stellar.min.js' %}"></script>
    <script src="{% static 'js/owl.carousel.min.js' %}"></script>
    <script src="{% static 'js/jquery.magnific-popup.min.js' %}"></script>
    <script src="{% static 'js/aos.js' %}"></script>
    <script src="{% static 'js/jquery.animateNumber.min.js' %}"></script>
    <script src="{% static 'js/bootstrap-datepicker.js' %}"></script>
    <script src="j{% static 'js/jquery.timepicker.min.js' %}"></script>
    <script src="{% static 'js/scrollax.min.js' %}"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBVWaKrjvy3MaE7SQ74_uJiULgl1JY0H2s&sensor=false"></script>
    <script src="{% static 'js/google-map.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>
    <script>
      // Auto-dismiss popup messages after 5 seconds.
      window.addEventListener('load', function () {
        setTimeout(function () {
          document.querySelectorAll('.messages-toast .alert').forEach(function (el) {
            if (window.jQuery) { window.jQuery(el).alert('close'); }
            else { el.remove(); }
          });
        }, 5000);
      });
    </script>
  </body>
</html>
